<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <linearGradient id="brideGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C5C0D" />
    </linearGradient>
    <linearGradient id="lehengaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="60%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#720E1E" />
    </linearGradient>
    <radialGradient id="brideHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Glow & Frame -->
  <rect width="300" height="360" rx="16" fill="#2d050c" />
  <circle cx="150" cy="150" r="110" fill="url(#brideHalo)" />

  <!-- Royal Floral Mandala Arch -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="url(#brideGold)" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="150" cy="150" r="126" fill="none" stroke="url(#brideGold)" stroke-width="1" />

  <!-- BRIDE SILHOUETTE (Vaishnavi - The Royal Indian Bride) -->
  <!-- Red & Gold Zari Dupatta Veil draping around shoulders -->
  <path d="M 60,350 C 70,220 95,120 150,115 C 205,120 230,220 240,350 Z" fill="url(#lehengaRed)" />
  <path d="M 80,350 C 90,240 110,135 150,130 C 190,135 210,240 220,350 Z" fill="url(#brideGold)" opacity="0.25" stroke="url(#brideGold)" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Dupatta Gold Zari Border Arch -->
  <path d="M 85,250 C 95,145 120,120 150,120 C 180,120 205,145 215,250" fill="none" stroke="url(#brideGold)" stroke-width="6" />

  <!-- Bride's Elegant Face Contour & Neck -->
  <path d="M 132,150 Q 150,195 168,150" fill="#FFDFC4" stroke="#D7A17B" stroke-width="1.2" />
  <ellipse cx="150" cy="145" rx="26" ry="32" fill="#FFE0B2" />

  <!-- Traditional Hair Bun (Juda) with Jasmine Gajra -->
  <circle cx="150" cy="115" r="28" fill="#2C1B18" />
  <!-- Floral Gajra Garland around Bun -->
  <circle cx="128" cy="120" r="4.5" fill="#FFFFFF" stroke="#FFE082" />
  <circle cx="134" cy="110" r="5" fill="#FFFFFF" stroke="#FFE082" />
  <circle cx="145" cy="104" r="5.5" fill="#FFFFFF" stroke="#FFE082" />
  <circle cx="156" cy="104" r="5.5" fill="#FFFFFF" stroke="#FFE082" />
  <circle cx="166" cy="110" r="5" fill="#FFFFFF" stroke="#FFE082" />
  <circle cx="172" cy="120" r="4.5" fill="#FFFFFF" stroke="#FFE082" />

  <!-- Maang Tikka (Golden Forehead Ornament) -->
  <line x1="150" y1="112" x2="150" y2="132" stroke="url(#brideGold)" stroke-width="2.5" />
  <circle cx="150" cy="133" r="5" fill="url(#brideGold)" />
  <circle cx="150" cy="133" r="2.5" fill="#D32F2F" />

  <!-- Auspicious Bridal Bindi -->
  <circle cx="150" cy="142" r="3.2" fill="#B71C1C" />
  <circle cx="150" cy="142" r="1.2" fill="#FFF" />

  <!-- Eyes & Eyebrows (Gentle, expressive bridal eyes) -->
  <path d="M 137,148 Q 143,144 148,148" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 152,148 Q 157,144 163,148" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Eyelashes -->
  <path d="M 138,150 Q 143,153 147,150" stroke="#1A0C08" stroke-width="1.8" fill="none" />
  <path d="M 153,150 Q 157,153 162,150" stroke="#1A0C08" stroke-width="1.8" fill="none" />

  <!-- Traditional Bridal Nath (Nose Ring with Pearl Chain) -->
  <circle cx="144" cy="158" r="6" fill="none" stroke="url(#brideGold)" stroke-width="1.5" />
  <circle cx="140" cy="158" r="1.5" fill="#D32F2F" />
  <path d="M 144,158 Q 132,154 126,146" fill="none" stroke="url(#brideGold)" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Soft Radiant Smile -->
  <path d="M 144,166 Q 150,171 156,166" stroke="#C2185B" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Heavy Kundan & Gold Bridal Choker Necklace -->
  <path d="M 134,180 Q 150,195 166,180" fill="none" stroke="url(#brideGold)" stroke-width="6" />
  <path d="M 130,190 Q 150,210 170,190" fill="none" stroke="url(#brideGold)" stroke-width="4" stroke-dasharray="4,3" />
  <circle cx="150" cy="204" r="5" fill="#D32F2F" stroke="url(#brideGold)" stroke-width="1.5" />

  <!-- Ornate Royal Jhumka Earrings -->
  <circle cx="124" cy="152" r="3.5" fill="url(#brideGold)" />
  <path d="M 121,156 L 127,156 L 124,163 Z" fill="url(#brideGold)" />
  <circle cx="176" cy="152" r="3.5" fill="url(#brideGold)" />
  <path d="M 173,156 L 179,156 L 176,163 Z" fill="url(#brideGold)" />

  <!-- Golden Caption Plaque at Bottom -->
  <rect x="35" y="308" width="230" height="38" rx="19" fill="#1b0307" stroke="url(#brideGold)" stroke-width="1.5" />
  <text x="150" y="332" text-anchor="middle" font-family="'Cinzel Decorative', serif" font-size="14" font-weight="bold" fill="url(#brideGold)" letter-spacing="2">
    VAISHNAVI (THE BRIDE)
  </text>
</svg>
