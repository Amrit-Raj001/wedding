<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pairGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C5C0D" />
    </linearGradient>
    <radialGradient id="pairAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#FFB300" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="500" height="360" rx="16" fill="#240409" />
  <circle cx="250" cy="160" r="140" fill="url(#pairAura)" />
  <circle cx="250" cy="160" r="148" fill="none" stroke="url(#pairGold)" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Sacred Varmala Garland uniting both -->
  <path d="M 170,190 Q 250,285 330,190" fill="none" stroke="url(#pairGold)" stroke-width="12" stroke-dasharray="10,6" />
  <path d="M 170,190 Q 250,285 330,190" fill="none" stroke="#D32F2F" stroke-width="6" stroke-dasharray="6,8" />

  <!-- Groom Silhouette on Left -->
  <g transform="translate(45, 10)">
    <!-- Safa / Turban -->
    <path d="M 130,135 C 124,105 140,90 160,90 C 180,90 196,105 190,135 Z" fill="#880E1E" stroke="url(#pairGold)" stroke-width="2" />
    <circle cx="160" cy="95" r="4" fill="url(#pairGold)" />
    <!-- Face -->
    <ellipse cx="160" cy="148" rx="22" ry="26" fill="#FFE0B2" />
    <!-- Sherwani -->
    <path d="M 90,320 L 105,200 L 140,175 L 180,175 L 215,200 L 230,320 Z" fill="#F5E6CA" stroke="url(#pairGold)" stroke-width="1.5" />
    <path d="M 100,200 Q 95,270 108,320 L 132,320 Q 120,250 125,190 Z" fill="#880E1E" />
  </g>

  <!-- Bride Silhouette on Right -->
  <g transform="translate(195, 10)">
    <!-- Veil / Dupatta -->
    <path d="M 75,320 C 85,200 105,105 155,100 C 205,105 225,200 235,320 Z" fill="#B71C1C" />
    <path d="M 95,225 C 105,125 125,105 155,105 C 185,105 205,125 215,225" fill="none" stroke="url(#pairGold)" stroke-width="5" />
    <!-- Face -->
    <ellipse cx="155" cy="140" rx="22" ry="28" fill="#FFE0B2" />
    <circle cx="155" cy="128" r="2.5" fill="#D32F2F" />
    <circle cx="155" cy="136" r="2.5" fill="#B71C1C" />
  </g>

  <!-- Heart & Rings Union Emblem in Center -->
  <g transform="translate(250, 160)">
    <circle cx="0" cy="0" r="28" fill="#5e0a17" stroke="url(#pairGold)" stroke-width="2" />
    <path d="M 0,-12 C -6,-22 -20,-16 -18,-4 C -16,6 0,16 0,22 C 0,16 16,6 18,-4 C 20,-16 6,-22 0,-12 Z" fill="#E53935" transform="scale(0.8)" />
    <!-- Entwined Rings -->
    <circle cx="-6" cy="4" r="8" fill="none" stroke="url(#pairGold)" stroke-width="2.5" />
    <circle cx="6" cy="4" r="8" fill="none" stroke="url(#pairGold)" stroke-width="2.5" />
  </g>

  <!-- Title Ribbon -->
  <rect x="110" y="306" width="280" height="38" rx="19" fill="#1b0307" stroke="url(#pairGold)" stroke-width="1.5" />
  <text x="250" y="330" text-anchor="middle" font-family="'Cinzel Decorative', serif" font-size="13.5" font-weight="bold" fill="url(#pairGold)" letter-spacing="2">
    VAISHNAVI &amp; NIKHIL • 25.11.2026
  </text>
</svg>
