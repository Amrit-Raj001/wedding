<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFB300" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#FF3D00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clayGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
  </defs>

  <!-- Flame Glow Background -->
  <circle cx="70" cy="50" r="38" fill="url(#flameGlow)" />

  <!-- Diya Clay / Brass Vessel -->
  <ellipse cx="70" cy="98" rx="42" ry="12" fill="#5D4037" opacity="0.3"/>
  <path d="M 22,86 C 25,108 55,115 70,115 C 85,115 115,108 118,86 C 112,82 95,88 70,88 C 45,88 28,82 22,86 Z" 
        fill="url(#clayGold)" stroke="#6D4C13" stroke-width="1.8"/>
  <ellipse cx="70" cy="86" rx="46" ry="10" fill="#AA771C" stroke="url(#clayGold)" stroke-width="1.5"/>
  <ellipse cx="70" cy="85" rx="40" ry="7" fill="#603813"/>

  <!-- Golden Ornaments on Vessel -->
  <circle cx="70" cy="100" r="3" fill="#FFF2A3"/>
  <circle cx="50" cy="97" r="2.5" fill="#FFF2A3"/>
  <circle cx="90" cy="97" r="2.5" fill="#FFF2A3"/>

  <!-- Oil & Wick -->
  <ellipse cx="70" cy="83" rx="28" ry="4" fill="#E65100"/>
  <path d="M 69,82 Q 70,72 70,68" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>

  <!-- Divine Flame (Teardrop Jyoti) -->
  <path d="M 70,26 C 63,45 56,60 62,70 C 66,76 74,76 78,70 C 84,60 77,45 70,26 Z" fill="#FF5722"/>
  <path d="M 70,36 C 65,48 61,58 65,66 C 68,71 72,71 75,66 C 79,58 75,48 70,36 Z" fill="#FFC107"/>
  <path d="M 70,48 C 67,56 66,61 68,66 C 69,68 71,68 72,66 C 74,61 73,56 70,48 Z" fill="#FFFDE7"/>
</svg>
