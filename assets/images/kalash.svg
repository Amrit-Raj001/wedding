<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="100%" height="100%">
  <defs>
    <linearGradient id="kalashGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C5C0D" />
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="coconutBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1887F" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>
  </defs>

  <!-- Mango Leaves (Amrapallav) -->
  <path d="M 80,65 C 60,35 40,25 20,40 C 35,60 55,68 80,65 Z" fill="url(#leafGreen)" stroke="#D4AF37" stroke-width="1"/>
  <path d="M 80,65 C 100,35 120,25 140,40 C 125,60 105,68 80,65 Z" fill="url(#leafGreen)" stroke="#D4AF37" stroke-width="1"/>
  <path d="M 80,65 C 65,25 60,10 50,5 C 68,20 75,45 80,65 Z" fill="url(#leafGreen)" stroke="#D4AF37" stroke-width="1"/>
  <path d="M 80,65 C 95,25 100,10 110,5 C 92,20 85,45 80,65 Z" fill="url(#leafGreen)" stroke="#D4AF37" stroke-width="1"/>

  <!-- Sacred Coconut (Shriphal) on Top -->
  <path d="M 80,10 C 65,25 65,55 80,65 C 95,55 95,25 80,10 Z" fill="url(#coconutBrown)" stroke="url(#kalashGold)" stroke-width="2"/>
  <!-- Tilak on Coconut -->
  <line x1="80" y1="25" x2="80" y2="45" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="50" r="3" fill="#FFD54F"/>

  <!-- Kalash Pot Body (Lota/Kumbha) -->
  <!-- Rim / Mouth -->
  <ellipse cx="80" cy="70" rx="35" ry="8" fill="url(#kalashGold)" stroke="#8C5C0D" stroke-width="1.5"/>
  <!-- Neck -->
  <path d="M 52,70 Q 56,85 45,95 Q 35,115 42,135 Q 50,155 80,158 Q 110,155 118,135 Q 125,115 115,95 Q 104,85 108,70 Z" 
        fill="url(#kalashGold)" stroke="#6D4C13" stroke-width="2"/>
  <!-- Base Pedestal -->
  <ellipse cx="80" cy="158" rx="28" ry="7" fill="url(#kalashGold)" stroke="#6D4C13" stroke-width="1.5"/>

  <!-- Auspicious Swastik on Kalash Pot -->
  <g transform="translate(80, 118) scale(0.9)">
    <path d="M 0,-15 L 0,15 M -15,0 L 15,0 M 0,-15 L 12,-15 M 15,0 L 15,12 M 0,15 L -12,15 M -15,0 L -15,-12" 
          stroke="#C2185B" stroke-width="3.5" stroke-linecap="square" fill="none"/>
    <circle cx="-6" cy="-6" r="1.8" fill="#C2185B"/>
    <circle cx="6" cy="-6" r="1.8" fill="#C2185B"/>
    <circle cx="-6" cy="6" r="1.8" fill="#C2185B"/>
    <circle cx="6" cy="6" r="1.8" fill="#C2185B"/>
  </g>

  <!-- Sacred Red Thread (Moli/Kalawa) around the neck -->
  <path d="M 50,80 Q 80,88 110,80" fill="none" stroke="#D32F2F" stroke-width="4"/>
  <path d="M 52,83 Q 80,91 108,83" fill="none" stroke="#FFD54F" stroke-width="2"/>
</svg>
