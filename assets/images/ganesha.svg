<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#85580F" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#720E1E" />
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFB300" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Divine Aura / Halo -->
  <circle cx="200" cy="180" r="160" fill="url(#haloGrad)" />

  <!-- Sun Rays in Halo -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="20" x2="200" y2="45" />
    <line x1="200" y1="315" x2="200" y2="340" />
    <line x1="40" y1="180" x2="65" y2="180" />
    <line x1="335" y1="180" x2="360" y2="180" />
    <line x1="87" y1="67" x2="105" y2="85" />
    <line x1="295" y1="275" x2="313" y2="293" />
    <line x1="313" y1="67" x2="295" y2="85" />
    <line x1="105" y1="275" x2="87" y2="293" />
  </g>

  <!-- Ornate Halo Ring -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="200" cy="180" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Sacred Lotus Base -->
  <g transform="translate(200, 375)">
    <path d="M 0,10 C -40,-10 -90,10 -110,35 C -60,40 -20,25 0,38 C 20,25 60,40 110,35 C 90,10 40,-10 0,10 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M -60,25 C -40,-5 0,-15 0,-15 C 0,-15 40,-5 60,25 C 30,15 0,25 0,25 C 0,25 -30,15 -60,25 Z" fill="url(#goldGrad)" />
    <!-- Center petal -->
    <path d="M 0,-25 C -25,0 -20,20 0,30 C 20,20 25,0 0,-25 Z" fill="#FFE082" />
  </g>

  <!-- GANESHA MAIN FIGURE (Classical Calligraphic & Sacred Form) -->
  <g filter="url(#goldGlow)">
    <!-- Crown (Mukut) -->
    <path d="M 170,110 L 200,35 L 230,110 Z" fill="url(#goldGrad)" stroke="#FFF2A3" stroke-width="2" />
    <path d="M 180,110 L 200,60 L 220,110 Z" fill="url(#redGrad)" />
    <!-- Crown Ornaments -->
    <circle cx="200" cy="40" r="6" fill="#FFF2A3" />
    <circle cx="200" cy="75" r="4" fill="#FFF2A3" />
    <circle cx="185" cy="98" r="3" fill="#FFF2A3" />
    <circle cx="215" cy="98" r="3" fill="#FFF2A3" />

    <!-- Mukut Base Band -->
    <rect x="160" y="106" width="80" height="12" rx="4" fill="url(#goldGrad)" stroke="#85580F" stroke-width="1" />
    <circle cx="180" cy="112" r="2.5" fill="#B71C1C" />
    <circle cx="200" cy="112" r="3" fill="#B71C1C" />
    <circle cx="220" cy="112" r="2.5" fill="#B71C1C" />

    <!-- Left Large Ear (Supada Karana) -->
    <path d="M 162,118 C 110,120 70,150 78,195 C 85,230 120,235 155,225" 
          fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 160,135 C 125,138 98,160 102,192 C 107,215 130,218 152,212" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="2,3" />
    <!-- Ear earring -->
    <circle cx="85" cy="225" r="6" fill="url(#goldGrad)" />
    <circle cx="85" cy="235" r="3" fill="#B71C1C" />

    <!-- Right Ear -->
    <path d="M 238,118 C 290,120 330,150 322,195 C 315,230 280,235 245,225" 
          fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 240,135 C 275,138 302,160 298,192 C 293,215 270,218 248,212" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="2,3" />
    <!-- Right earring -->
    <circle cx="315" cy="225" r="6" fill="url(#goldGrad)" />
    <circle cx="315" cy="235" r="3" fill="#B71C1C" />

    <!-- Forehead (Mastak) & Royal Trunk (Sond) curving gracefully to the left (Vamamukhi Ganesha - Auspicious for Home & Prosperity) -->
    <path d="M 180,122 C 190,125 210,125 220,122 C 235,145 235,175 228,210 C 220,250 215,275 200,305 C 185,335 140,335 130,305 C 122,280 145,268 158,280 C 168,290 155,305 145,300" 
          fill="none" stroke="url(#goldGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sacred Tilak / Trishul on Forehead -->
    <path d="M 190,140 Q 200,165 200,180 Q 200,165 210,140" fill="none" stroke="#D32F2F" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="135" x2="200" y2="182" stroke="#FFF2A3" stroke-width="2.5" />
    <circle cx="200" cy="188" r="4.5" fill="#D32F2F" />

    <!-- Divine Eyes -->
    <path d="M 166,160 Q 177,153 186,162" fill="none" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="178" cy="162" r="2.5" fill="#3E2723" />
    <path d="M 214,162 Q 223,153 234,160" fill="none" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="222" cy="162" r="2.5" fill="#3E2723" />

    <!-- Single Auspicious Tusk (Ekdanta) -->
    <path d="M 226,215 L 244,228 L 228,228 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1" />

    <!-- Modak / Laddu in Trunk / Hand -->
    <circle cx="138" cy="275" r="11" fill="url(#goldGrad)" stroke="#B71C1C" stroke-width="1.5" />
    <circle cx="138" cy="272" r="2" fill="#D32F2F" />
    <circle cx="135" cy="276" r="1.5" fill="#D32F2F" />
    <circle cx="141" cy="276" r="1.5" fill="#D32F2F" />

    <!-- Abhaya Mudra (Blessing Hand) on Left (viewer's right) -->
    <g transform="translate(265, 230)">
      <path d="M 10,15 C 20,5 35,5 40,25 C 45,45 35,65 15,65 C 5,65 0,55 5,40 Z" fill="url(#goldGrad)" />
      <!-- Palm Auspicious Swastik / Lotus mark -->
      <circle cx="22" cy="35" r="6" fill="#B71C1C" />
      <path d="M 22,31 L 22,39 M 18,35 L 26,35" stroke="#FFF2A3" stroke-width="1.5" />
    </g>

    <!-- Sacred Janeu Thread -->
    <path d="M 160,240 Q 185,290 240,320" fill="none" stroke="#FFF" stroke-width="2" stroke-dasharray="4,2" />

    <!-- Little Mooshak (Vahana) silhouette at feet -->
    <path d="M 290,360 C 275,360 265,348 275,340 C 285,335 295,345 305,350 C 315,355 315,360 300,360 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 270,342 Q 262,340 260,342" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" />
  </g>

  <!-- Sacred Mantra Inscription Ring Text Arc Placeholder -->
  <text x="200" y="425" text-anchor="middle" font-family="'Cinzel Decorative', 'Marcellus', serif" font-size="16" font-weight="bold" fill="url(#goldGrad)" letter-spacing="3">
    ॥ ॐ गं गणपतये नमः ॥
  </text>
</svg>
