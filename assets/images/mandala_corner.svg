<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C5C0D" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#cornerGold)" stroke-width="1.8">
    <!-- Outer Corner Border Frame -->
    <path d="M 5,90 L 5,20 Q 5,5 20,5 L 90,5" stroke-width="2.5" />
    <path d="M 14,80 L 14,22 Q 14,14 22,14 L 80,14" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Ornate Mandala Swirls in Corner -->
    <circle cx="28" cy="28" r="16" stroke-width="1.5" />
    <circle cx="28" cy="28" r="8" fill="url(#cornerGold)" opacity="0.3" />
    <circle cx="28" cy="28" r="3" fill="url(#cornerGold)" />

    <!-- Radiant Petals radiating inward -->
    <path d="M 28,12 Q 35,20 28,28 Q 21,20 28,12 Z" fill="url(#cornerGold)" opacity="0.7"/>
    <path d="M 44,28 Q 36,35 28,28 Q 36,21 44,28 Z" fill="url(#cornerGold)" opacity="0.7"/>
    <path d="M 28,44 Q 21,36 28,28 Q 35,36 28,44 Z" fill="url(#cornerGold)" opacity="0.7"/>
    <path d="M 12,28 Q 20,21 28,28 Q 20,35 12,28 Z" fill="url(#cornerGold)" opacity="0.7"/>

    <!-- Flourishes stretching out -->
    <path d="M 5,30 Q 15,25 20,35" stroke-linecap="round" />
    <path d="M 30,5 Q 25,15 35,20" stroke-linecap="round" />
    <path d="M 40,14 Q 55,8 70,14" stroke-linecap="round" />
    <path d="M 14,40 Q 8,55 14,70" stroke-linecap="round" />
    <circle cx="75" cy="14" r="2.5" fill="url(#cornerGold)" />
    <circle cx="14" cy="75" r="2.5" fill="url(#cornerGold)" />
  </g>
</svg>
